<style>
:root{--bg:#ffffff;--fg:#111111;--mu:#666666;--line:#cccccc;--acc:#111111}

button[disabled]{opacity:.6;cursor:default}
#msg{min-height:18px;margin-top:10px;font-size:13px;color:var(--mu)}
</style>
