<style>
:root{--bg:#ffffff;--fg:#111111;--mu:#666666;--line:#cccccc;--acc:#111111}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center}
form{width:min(360px,calc(100% - 32px))}

button[disabled]{opacity:.6;cursor:default}
#msg{min-height:18px;margin-top:10px;font-size:13px;color:var(--mu)}
</style>
